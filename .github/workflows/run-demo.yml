name: Run gittuf demo
on:
  push:
    branches: ['main']
    paths:
      - 'run-*.py'
      - 'demo_utils.py'
      - 'keys/**'
      - '.github/workflows/run-demo.yml'
  pull_request:
    paths:
      - 'run-*.py'
      - 'demo_utils.py'
      - 'keys/**'
      - '.github/workflows/run-demo.yml'
  workflow_dispatch:

jobs:
  run-demo:
    name: Run ${{ matrix.demo.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo:
          - name: gittuf demo
            script: run-demo.py
          - name: multi-repo demo
            script: run-multi-repo-demo.py
          - name: recovery demo
            script: run-recovery-demo.py
          - name: signatures demo
            script: run-signatures-demo.py
    steps:
      - name: Checkout demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - name: Install gittuf
        uses: gittuf/gittuf-installer@f3f980c73becd7402e78cb18a7ae31b7d9895817
        with:
          gittuf-version: 'main'
      - name: Run demo with --no-prompt
        run: |
          python3 ${{ matrix.demo.script }} --no-prompt
